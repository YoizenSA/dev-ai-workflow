# air hot-reload config for ywai development.
# Rebuilds the dev binary on every .go change and restarts the control server
# in the foreground. `serve` re-acquires port 5768 (killing any straggler), and
# a non-embedded build serves the web UI straight from internal/control/web/dist,
# so only .go changes trigger a rebuild — frontend edits are picked up by a
# plain browser refresh, or live via `dev.sh web` (vite HMR on :3000).
root = "."
tmp_dir = "tmp"

[build]
# Dev binary, no embedded data: UI/assets read from disk for fast iteration.
cmd = "go build -o ywai-dev.exe ./cmd/ywai"
entrypoint = ["./ywai-dev.exe", "serve", "--no-update"]
include_ext = ["go"]
exclude_dir = ["internal/control/web", "embedded_data", "e2e", "tmp", "testdata", "docs"]
exclude_regex = ["_test\\.go"]
# Debounce: editors fire several save events per write.
delay = 1000
stop_on_error = true
send_interrupt = true
kill_delay = "2s"

[log]
time = false
main_only = true

[misc]
# Remove tmp/ (air's build log) on exit.
clean_on_exit = true
