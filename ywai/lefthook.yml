# Frontend-only leftover. Git root is the monorepo, so this file is not
# loaded. Go lint (the CI job) lives in .githooks + ywai/scripts/lint.sh.
# Install: bash scripts/install-hooks.sh (from the repo root).
pre-commit:
  parallel: true
  commands:
    stylelint:
      glob: "internal/control/web/**/*.css"
      root: "internal/control/web"
      run: npm run stylelint -- {staged_files}
    eslint:
      glob: "internal/control/web/**/*.{ts,tsx}"
      root: "internal/control/web"
      run: npm run lint -- {staged_files}
    typecheck:
      glob: "internal/control/web/**/*.{ts,tsx}"
      root: "internal/control/web"
      run: npx tsc --noEmit
